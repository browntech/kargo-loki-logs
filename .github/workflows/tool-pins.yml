name: Tool pins

# Dependabot does not update the tool versions in the workflow `env:` blocks.
# This job compares them with the latest stable releases each week and keeps
# one open issue that lists the stale pins. It closes that issue when every
# pin is current again.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: tool-pins
  cancel-in-progress: false

jobs:
  check:
    name: Check tool pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare pins with latest releases
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .github/scripts/check-tool-pins.sh > "${RUNNER_TEMP}/stale.md"
          cat "${RUNNER_TEMP}/stale.md"

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Workflow tool pins are out of date"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number="$(gh issue list --state open --search "in:title \"${TITLE}\"" \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"

          if [[ ! -s "${RUNNER_TEMP}/stale.md" ]]; then
            if [[ -n "${number}" ]]; then
              gh issue close "${number}" --comment "All workflow tool pins are current (${RUN_URL})."
            fi
            echo "All pins are current."
            exit 0
          fi

          {
            echo "These pins in the workflow \`env:\` blocks are behind the latest stable release."
            echo "Dependabot does not update them."
            echo
            cat "${RUNNER_TEMP}/stale.md"
            echo
            echo "Last checked by ${RUN_URL}."
          } > "${RUNNER_TEMP}/body.md"

          if [[ -n "${number}" ]]; then
            gh issue edit "${number}" --body-file "${RUNNER_TEMP}/body.md"
            echo "Updated issue #${number}."
          else
            gh issue create --title "${TITLE}" --body-file "${RUNNER_TEMP}/body.md"
          fi
