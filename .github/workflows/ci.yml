name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_VERSION: v4.3.2
  # helm-unittest plugin tarball, pinned by SHA-256. Update both values together:
  # the checksum is the sha256sum of unittest-<version>.tgz on the GitHub release.
  HELM_UNITTEST_VERSION: 1.2.1
  HELM_UNITTEST_SHA256: bbcebd42631dff9fc595462fad839c49a1b06f9635e952e7e837d7e5fe82865f
  GOLANGCI_LINT_VERSION: v2.15.0
  COSIGN_VERSION: v3.1.4

jobs:
  go:
    name: Go test, vet and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  helm:
    name: Helm lint and unittest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
          checksum-policy: required

      - name: Install helm-unittest plugin
        run: |
          set -euo pipefail
          tgz="unittest-${HELM_UNITTEST_VERSION}.tgz"
          url="https://github.com/helm-unittest/helm-unittest/releases/download/v${HELM_UNITTEST_VERSION}/${tgz}"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tgz}" "${url}"
          echo "${HELM_UNITTEST_SHA256}  ${RUNNER_TEMP}/${tgz}" | sha256sum -c -
          # The SHA-256 above is the integrity check; Helm's own provenance check
          # needs the publisher's GPG key in a local keyring.
          helm plugin install "${RUNNER_TEMP}/${tgz}" --verify=false
          helm plugin list

      - name: helm lint
        run: |
          helm lint charts/kargo-loki-logs
          helm lint charts/kargo-loki-logs -f charts/kargo-loki-logs/ci/all-options-values.yaml

      - name: helm unittest
        run: helm unittest charts/kargo-loki-logs

  image:
    name: Image build (amd64, arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify the distroless base image signature
        run: |
          set -euo pipefail
          base="$(grep -oE 'gcr\.io/distroless/[^ ]+@sha256:[0-9a-f]{64}' Dockerfile)"
          test -n "${base}"
          cosign verify "${base}" \
            --certificate-oidc-issuer https://accounts.google.com \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com \
            > /dev/null
          echo "verified ${base}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
